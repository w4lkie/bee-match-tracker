name: Check static tracker
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check page files and icons
        shell: bash
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f favicon.svg
          test -f icons/royal-jelly.svg
          for route in small med night extreme winter spirit; do
            test -f "$route/index.html"
          done
      - name: Verify replacement artwork is real square icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/real-bss-icons
          files=(
            'Gumdrops.webp'
            'Moon_Charm.webp'
            'Field_Dice.webp'
            'Enzymes.webp'
            'Star_Jelly.webp'
          )
          for image in "${files[@]}"; do
            curl --retry 2 --fail --location --silent --show-error --max-time 30 "https://cdn.jsdelivr.net/gh/BSS-AI/BSS-AI@main/GUI/public/assets/${image}" -o "/tmp/real-bss-icons/$image"
            file "/tmp/real-bss-icons/$image"
            file --mime-type "/tmp/real-bss-icons/$image" | grep -q 'image/webp'
          done
          for image in 'Magic_Bean.webp' 'Micro-Converter.webp' 'Jelly_Beans.webp'; do
            curl --retry 2 --fail --location --silent --show-error --max-time 30 "https://cdn.jsdelivr.net/gh/IamDanteDev/Bee-Swarm-Simulator-Remake@main/assets/Icons/bss/${image}" -o "/tmp/real-bss-icons/$image"
            file "/tmp/real-bss-icons/$image"
            file --mime-type "/tmp/real-bss-icons/$image" | grep -q 'image/webp'
          done
          curl --retry 2 --fail --location --silent --show-error --max-time 30 "https://cdn.jsdelivr.net/gh/m4thcreator/BSSTrades@main/imageslibrary/services/Night_Bell.webp" -o "/tmp/real-bss-icons/Night_Bell.webp"
          file /tmp/real-bss-icons/Night_Bell.webp
          file --mime-type /tmp/real-bss-icons/Night_Bell.webp | grep -q 'image/webp'
